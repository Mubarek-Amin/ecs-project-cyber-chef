name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.OIDC_ARN }}
          aws-region: us-east-1

      - name: terraform setup
        uses: hashicorp/setup-terraform@v4

      - name: terraform check
        run: |
          cd ./Terraform
          terraform init
          terraform fmt -check -recursive && terraform validate

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
         scan-type: config
         scan-ref: ./Terraform
         severity: CRITICAL,HIGH
         exit-code: 1

      - name: Install terragrunt
        run: |
          sudo curl -Lo /usr/local/bin/terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.67.0/terragrunt_linux_amd64
          sudo chmod +x /usr/local/bin/terragrunt
          terragrunt --version
      - name: resolve env
        run: |
          BRANCH="${{github.event.workflow_run.head_branch}}"
          if [ "$BRANCH" = "main" ]; then
            echo "ENV=prod" >> "$GITHUB_ENV"
          else
            echo "ENV=$BRANCH" >> "$GITHUB_ENV"
          fi
      - name: terraform deploy
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd Terraform/live/$ENV
          terragrunt init
          terragrunt plan
          terragrunt apply --auto-approve
