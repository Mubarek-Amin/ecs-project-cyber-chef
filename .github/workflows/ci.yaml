name: ci

on:
    push:
      branches: [dev,staging,main]
    pull_request:
      branches:
        - main
jobs: 
    build: 
        name: ci
        runs-on: ubuntu-latest
        permissions:
          id-token: write
          contents: read
          security-events: write
        env:
          REPOSITORY: ecs_tc
          IMAGE_TAG: ${{ github.sha }}
        steps:
          - name: checkout
            uses: actions/checkout@v7
            with: 
              fetch-depth: 0

          - name: OIDC
            uses: aws-actions/configure-aws-credentials@v6.3.0
            with:
              role-to-assume: ${{ vars.OIDC_ARN }}
              aws-region: us-east-1

          - name: ecr login
            id: login
            uses: aws-actions/amazon-ecr-login@v2
          
          - name: CodeQl
            uses: github/codeql-action/init@v4
            with:
              languages: javascript-typescript
          
          - name: CodeQL analyze
            uses: github/codeql-action/analyze@v4

          - name: terraform setup
            uses: hashicorp/setup-terraform@v4

          - name: Install terragrunt
            run: |
              sudo curl -Lo /usr/local/bin/terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.67.0/terragrunt_linux_amd64
              sudo chmod +x /usr/local/bin/terragrunt
              terragrunt --version

          - name: resolve env
            run: |
              if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "ENV=prod" >> "$GITHUB_ENV"
              elif [ "${{ github.ref_name }}" = "main" ]; then
              echo "ENV=prod" >> "$GITHUB_ENV"
              else
              echo "ENV=${{ github.ref_name }}" >> "$GITHUB_ENV"
              fi

          - name: terraform review
            run: |
              cd terraform/live/$ENV
              terragrunt init
              terragrunt plan

          - name: docker build and tag
            env:
              REGISTRY: ${{ steps.login.outputs.registry}}
            run: |
              cd ./app
              docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

          - name: image scan
            env:
              REGISTRY: ${{ steps.login.outputs.registry}}
            uses: aquasecurity/trivy-action@v0.36.0
            with:
              image-ref: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
              exit-code: 1
              ignore-unfixed: true
              severity: 'CRITICAL,HIGH'

          - name: docker push
            env:
              REGISTRY: ${{ steps.login.outputs.registry}}
            run: |
              cd ./app
              docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG


            
